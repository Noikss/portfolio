<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио Noikss - noikssdev</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            position: relative;
            overflow: hidden;
        }
        h1 {
            margin-top: 50px;
            font-size: 3em;
        }
        .button {
            background-color: #ff007f; /* Цвет кнопок */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s, transform 0.3s;
            border-radius: 5px;
            text-decoration: none; /* Убираем подчеркивание */
        }
        .button:hover {
            background-color: #e6006e; /* Цвет кнопок при наведении */
            transform: scale(1.05);
        }
        .projects {
            margin-top: 50px;
        }
        /* Фон с геометрическими фигурами */
        .background-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .shape {
            position: absolute;
            background: rgba(255, 0, 127, 0.3);
            border-radius: 50%;
        }
        .shape1 { width: 200px; height: 200px; top: 20%; left: 10%; }
        .shape2 { width: 150px; height: 150px; top: 60%; left: 70%; }
        .shape3 { width: 100px; height: 100px; top: 80%; left: 20%; }
        .shape4 { width: 250px; height: 250px; top: 30%; left: 50%; }
        .shape5 { width: 300px; height: 300px; top: 10%; left: 80%; }
    </style>
</head>
<body>
    <h1>Портфолио</h1>
    <p>Добро пожаловать на мой сайт!</p>
    <div class="projects">
        <h2>Мои проекты</h2>
        <a href="https://example.com/project1" class="button">Проект 1</a>
        <a href="https://example.com/project2" class="button">Проект 2</a>
        <a href="https://example.com/project3" class="button">Проект 3</a>
        <a href="https://example.com/project4" class="button">Проект 4</a>
        <a href="https://example.com/project5" class="button">Проект 5</a>
        <a href="https://example.com/project6" class="button">Проект 6</a>
    </div>

    <div class="background-shapes">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
        <div class="shape shape4"></div>
        <div class="shape shape5"></div>
    </div>
</body>
</html>
